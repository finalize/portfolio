version: 2

updates:
  # npm（pnpm-lock.yaml を自動検出する）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # minor と patch はまとめて1本のPRにする。CI がグリーンなら自動マージされる。
      # メジャー更新はこのグループに入らないので、個別PRとして残りレビュー待ちになる。
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 自体の更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
