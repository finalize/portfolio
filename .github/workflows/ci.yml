name: CI

# PR と push で型チェックとビルドを回す。デプロイはしない（公開を止めている）。
on:
  push:
    # claude/** も対象にするのは、Claude が作ったブランチのコミットに対して
    # 必須チェック（check & build）を成立させるため。
    # PR を GITHUB_TOKEN で作ると pull_request イベントが発火しない仕様のため、
    # push 側で同じ SHA のチェックを走らせておく。
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 型チェック
        run: pnpm check
      - name: ビルド
        run: pnpm build
