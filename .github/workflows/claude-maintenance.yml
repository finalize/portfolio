name: Claude Maintenance

# 毎日 09:17 JST に Claude がサイトを点検し、自分で直せるものは PR にして自動マージする。
# .github/ と CLAUDE.md（自動化の設定そのもの）を触った場合だけは自動マージせず、人間のレビューに回す。
on:
  schedule:
    # 09:17 JST。毎時ちょうどは GitHub 側の負荷が高く、遅延したりジョブが落とされたりする
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: claude-maintenance
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定のため点検をスキップしました"
          fi

  maintenance:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Glob,Grep,Edit,Write,WebFetch"
          prompt: |
            このリポジトリは Astro の静的サイト（Cloudflare Workers 配信）です。
            毎日の保守を自律的に行ってください。依存関係はインストール済みです。
            今日の日付は `TZ=Asia/Tokyo date +%F` で取得すること（ランナーは UTC）。

            ## 1. 点検

            - `pnpm audit --prod` と `pnpm audit`（本番依存に出たものは重要度が高い）
            - `pnpm outdated`。minor / patch は Dependabot が自動化しているので**メジャー更新だけ**を対象にする
            - `pnpm build` が警告なく通るか
            - `dist/` の HTML からリンクを集め、内部リンク（`/` 始まり）が実在するか、
              外部リンクが 404 / 410 でないかを確認する（タイムアウトや 403 は報告しない）
            - `astro.config.mjs` の `site` と `public/robots.txt` の Sitemap 行が、実際の公開 URL と一致しているか
            - 配色: `pnpm run check:contrast` を実行する（`pnpm check` にも含まれる）。
              実際に重なる組み合わせだけを検査しているので、ここで NG が出たら本物の問題として扱う。
              手計算でコントラスト比を出して報告しないこと
            - アクセシビリティ / SEO の明確な欠落: 画像の alt 抜け、見出し階層の飛び、meta description の欠落

            ## 2. 直す

            見つかった問題のうち、**自分で正しく直せると確信できるものだけ**を直す。
            1回の実行で扱うテーマは1つに絞り、差分は必要最小限にすること。
            直すものが無ければ何も変更しない（無理に仕事を作らない）。

            ## 3. 検証

            `pnpm check` と `pnpm build` を実行し、両方通ることを確認する。通らない変更は破棄する。
            見た目に影響する変更をした場合は、ビルド後の HTML を読んで構造が壊れていないことも確認する。

            ## 4. 整備ログを書く（変更の有無にかかわらず毎回行う）

            `src/content/log/<YYYY-MM-DD>.md`（JST の日付、ファイル名 = 日付）を**新規作成**する。
            既存のログファイルは編集しない。1日1ファイル。

            フロントマターは以下（`src/content.config.ts` の zod スキーマで検証される）:

            ```
            ---
            date: YYYY-MM-DD
            status: ok            # ok=点検のみ異常なし / changed=直した / reported=直さず issue にした
            summary: 一覧に1行で出る要約（40文字程度まで）
            pr: 12                # 変更した場合のみ。手順5で番号が分かってから書き足す
            issue: 3              # issue を作った・コメントした場合のみ
            ---
            ```

            本文には「直したこと」「点検結果」「直さずに残したこと」を簡潔に書く。
            異常が無かった日も必ず `status: ok` のログを残すこと。これがこのサイトの更新履歴になる。

            ## 5. PR を出して自動マージする

            変更が無い日でもログファイルがあるので、PR は毎日1本出る。次の順で行うこと。

            1. `claude/daily-<YYYY-MM-DD>` ブランチを切る
            2. 修正（あれば）とログファイルを commit して push
            3. `gh pr create` で PR を作る。本文には「何を」「なぜ」「どう検証したか」を書く。**PR 番号を控える**
            4. ログファイルのフロントマターに `pr: <控えた番号>` を書き足す
            5. `pnpm build` を実行し、ログのフロントマターがスキーマを満たしていることを確認する
            6. commit して push
            7. `gh pr merge --auto --squash <PR番号>` で自動マージを有効にする

            ただし **`.github/` 配下または `CLAUDE.md` を変更した場合は手順7を実行しないこと。**
            自動化の設定そのものは人間のレビューを通す。PR 本文にその旨を明記して残す。

            ## 6. 直せないものは issue にする

            確信を持って直せない項目（メジャー更新の破壊的変更、判断が必要な仕様変更など）が残ったら、
            `gh issue create` で issue を**1件だけ**作る。タイトルは `日次点検: <YYYY-MM-DD>`（JST）。
            先に `gh issue list --search "点検" --state open` を確認し、同種の open issue があれば
            新規作成せずその issue にコメントを追記する。
            issue を作った・コメントした場合は、ログの `issue:` にその番号を書くこと。

            ## 絶対に守ること

            - `src/consts.ts` の連絡先（メール・SNS）は本人が公開すると決めた値。勝手に変更・削除しない。
              git の設定や履歴から別のアドレスを拾って書き換えないこと（アカウントのメールと公開用のメールは別物）。
            - **本人に関する事実を創作しない。** 経歴・実績・所属・肩書きを推測で書き足さない。
              `src/pages/about.astro` の TODO 行は TODO のまま残す。
            - 記事本文（`src/content/blog/*.md`）の変更は、誤字・リンク切れ・技術的な誤りの修正に限る。
              主張や語り口は書き換えない。
            - デザイン変更は `src/styles/global.css` の既存 CSS 変数の範囲内で行う。
              新しい色・フォント・Web フォントを増やさない。
            - 依存を増やさない。必要だと判断したら、直さずに issue で提案する。
            - `git push --force` と main への直接 push は禁止。
            - 整備ログは事実だけを書く。実行していない点検を「実施した」と書かない。
            - 推測で報告しない。実際にコマンドを実行して得られた出力だけを根拠にする。
